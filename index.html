<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sparkie Dash: Perfect Stop</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <section id="startScreen" class="screen screen--active" aria-label="Start screen">
        <img
          id="startLogo"
          class="valu-logo"
          src="./Value-Logo.png"
          alt="Valu logo"
          data-fallback="logo"
        />
        <h1>Sparkie Dash</h1>
        <p class="subtitle">Perfect Stop</p>
        <p class="instruction">Stop Sparkie in the perfect zone</p>
        <button id="startBtn" class="btn btn--primary">Start Game</button>
        <div class="controls-note">Controls: STOP button / Space / Enter / Click / Tap • P = Pause</div>
      </section>

      <section id="gameScreen" class="screen" aria-label="Game screen">
        <header class="hud">
          <img
            id="gameLogo"
            class="valu-logo valu-logo--small"
            src="./Value-Logo.png"
            alt="Valu logo"
            data-fallback="logo"
          />
          <div class="hud-item"><span>Score</span><strong id="scoreValue">0</strong></div>
          <div class="hud-item"><span>Round</span><strong id="roundValue">1</strong></div>
          <div class="hud-item"><span>Best</span><strong id="bestValue">0</strong></div>
          <div class="hud-item"><span>Combo</span><strong id="comboValue">x1</strong></div>
        </header>

        <div class="track-wrap">
          <div id="track" class="track" role="presentation">
            <div id="goodZone" class="zone zone--good"></div>
            <div id="perfectZone" class="zone zone--perfect"></div>
            <div id="sparkie" class="sparkie" aria-label="Sparkie runner">
              <img
                id="sparkieImg"
                src="./sparkie_player.png"
                alt="Sparkie"
                data-fallback="sparkie"
              />
            </div>
          </div>
        </div>

        <div class="actions">
          <button id="stopBtn" class="btn btn--stop">STOP</button>
          <button id="pauseBtn" class="btn btn--ghost">Pause</button>
        </div>
      </section>
    </main>

    <section id="resultOverlay" class="overlay" aria-live="polite" aria-hidden="true">
      <div class="result-card">
        <h2 id="resultLabel">PERFECT</h2>
        <p id="resultPoints">+100</p>
        <div class="reward-wrap">
          <img id="rewardIcon" src="./coin_token.png" alt="Reward icon" data-fallback="reward" />
          <div id="rewardFallback" class="reward-fallback hidden" aria-hidden="true"></div>
        </div>
        <p id="accuracyText">Center hit!</p>
        <div class="overlay-actions">
          <button id="nextRoundBtn" class="btn btn--primary">Play Again</button>
          <button id="restartBtn" class="btn btn--ghost">Restart</button>
        </div>
      </div>
    </section>

    <script src="./game.js"></script>
  </body>
</html>
